name: Daily streaks update

# Rebuilds the streak data every night and commits it.
# The site (GitHub Pages) picks up the new data/streaks.json automatically.

on:
  # Runs once as soon as this workflow (or the pipeline) lands in the repo, so
  # setup is verified without waiting for the first midnight.
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"
  schedule:
    # 23:00 UTC == 00:00 WAT (Africa/Lagos) — the midnight update
    - cron: "0 23 * * *"
    # 05:00 UTC == 06:00 WAT — catch-up for late kickoffs (MLS / Liga MX finish
    # after midnight WAT) and for any GitHub scheduler delay
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: false
        default: full
        type: choice
        options: [full, daily, backfill, rebuild]
      chunk_days:
        description: "Days of history to backfill per chunk (backfill mode)"
        required: false
        default: "21"
      max_minutes:
        description: "Wall-clock budget for this run, in minutes"
        required: false
        default: "240"
      max_details:
        description: "Stats requests allowed in this run (8000 ≈ 2 months of history)"
        required: false
        default: "8000"

permissions:
  contents: write

concurrency:
  group: hotstreaks-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show current progress
        run: |
          echo "history files:";    ls -la data/history || true
          echo "state:";            cat data/state.json || true

      - name: Update streak data
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
          CHUNK: ${{ github.event.inputs.chunk_days || '21' }}
          BUDGET: ${{ github.event.inputs.max_minutes || '240' }}
          DETAILS: ${{ github.event.inputs.max_details || '8000' }}
        run: |
          python3 scripts/hotstreaks.py \
            --mode "$MODE" \
            --days 4 \
            --chunk-days "$CHUNK" \
            --max-details "$DETAILS" \
            --max-minutes "$BUDGET" \
            --venue-budget 60

      - name: Update other sports
        env:
          BUDGET: ${{ github.event.inputs.max_minutes || '240' }}
        run: |
          python3 scripts/sports.py --mode full \
            --days 4 --chunk-days 30 \
            --max-requests 2200 --max-minutes 80 --sport-budget 900 --stats-cap 140 \
            --horizon-days 430

      - name: Build the day's tickets
        # --min-size 15 is the floor: SportyBet's Flexi option wants 15 legs or
        # more, and the three tickets are each filled to at least that many legs.
        run: |
          python3 scripts/tickets.py --window 24 --size 16 --min-size 15 \
            --tickets 3 --max-per-match 2 --max-losses 5

      - name: Sanity-check the output
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("data/streaks.json"))
          print(f"{d['streakCount']} runs · {d['teamCount']} teams · "
                f"{d['eventCount']} matches · as of {d['asOf']}")
          assert d["streakCount"] > 0, "no streaks produced"
          assert d["eventCount"] > 0, "no matches in history"
          missing = [k for k in ("asOf","leagues","types","markets","streaks","stats") if k not in d]
          assert not missing, f"missing keys: {missing}"
          st = d["stats"]
          assert d["statsCount"] == len(st), "statsCount does not match the stats list"
          bad = [e for e in st if e["hits"] < 8 or e["hits"] > e["games"] or e["games"] > 10]
          assert not bad, f"{len(bad)} consistency entries break the 8-of-10 rule"
          thin = [e for e in st if e["games"] < 10]
          if thin:
              print(f"  {len(thin)} entries use a shorter window than 10 games (blank record or "
                    f"home-only runs) - the card prints the real denominator")
          starred = sum(1 for e in st
                        if any(s2["team"] == e["team"] and s2["league"] == e["league"]
                               and s2["type"] == e["type"] for s2 in d["streaks"]))
          print(f"consistency: {len(st)} entries (>=8 of the last 10) - "
                f"{starred} also have a live streak")
          if len(st) < 100:
              print(f"  WARNING: only {len(st)} consistency entries - check the archive depth")
          import os
          if os.path.exists("data/tickets.json"):
              tk = json.load(open("data/tickets.json"))
              print(f"tickets: {len(tk['tickets'])} · pool {tk['poolSize']} "
                    f"({tk['poolInWindow']} inside 24h)")
              for t in tk["tickets"]:
                  mix = ", ".join(f"{k} {v}" for k, v in t["sportBreakdown"].items())
                  print(f"  {t['name']:22} {t['flexi']['legs']:2} legs · "
                        f"odds {t['flexi']['totalOdds']:,} · {mix}")
                  assert t["flexi"]["allLegsAboveFloor"], "a leg fell below 1.50"
                  # SportyBet refuses stat markets on a Flexi slip: no ticket leg
                  # may come from one (fouls, throw-ins, tackles, match shots, ...)
                  blocked = {"fouls", "throws", "tackles", "shots", "other"}
                  bad = [l["typeLabel"] for l in t["legs"]
                         if (l.get("market") or "") in blocked
                         and l.get("type") not in ("team_sot_o45", "team_sot_o35")]
                  assert not bad, f"{t['name']} uses a market SportyBet blocks on Flexi: {bad}"
                  # 15 legs is what the Flexi option needs - warn, never fail the
                  # run, so a quiet day still commits the rest of the data
                  if t["flexi"]["legs"] < t.get("minLegs", 15):
                      print(f"  WARNING: {t['name']} has only {t['flexi']['legs']} legs "
                            f"(Flexi minimum {t.get('minLegs', 15)}) - the page flags it")
              if tk["tickets"]:
                  assert tk["poolInWindow"] > 0, "no selections inside the 24h window"
          if os.path.exists("data/sports.json"):
              sp = json.load(open("data/sports.json"))
              for key, sec in sp["sports"].items():
                  flag = "ok" if sec["available"] else "unavailable"
                  cst = sec.get("stats", [])
                  cbad = [e for e in cst
                          if e["hits"] < 8 or e["hits"] > e["games"] or e["games"] > 10]
                  assert not cbad, f"{key}: {len(cbad)} consistency entries break the 8-of-10 rule"
                  print(f"  {key:12} {flag:12} {sec['league']:38} {sec['streakCount']} runs "
                        f"· {len(cst)} consistent")
                  if sec["available"] and not cst:
                      print(f"  WARNING: {key} produced no consistency entries")
                  for lg in sec.get("leagueInfo", []):
                      nxt = (lg.get("nextGame") or "no fixtures yet")[:16]
                      print(f"      {lg['label']:12} {lg['games']:>5} games · "
                            f"{lg['runs']:>4} runs · next {nxt}")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name  "hotstreaks-bot"
          git config user.email "hotstreaks-bot@users.noreply.github.com"
          [ -d data ] && git add data || { echo "no data/ directory"; exit 0; }
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): streaks update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
          git push
